# Move this file to .github/workflows/update-and-deploy.yml to activate it.
name: Update data and deploy site

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # to publish the built site to the gh-pages branch (served by GitHub Pages)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data (public keyless APIs)
        run: python3 pipeline/fetch_data.py
      - name: Sanity check (refuse to publish a broken run)
        run: python3 pipeline/check_data.py
      - name: Build static site
        run: python3 pipeline/build_site.py
      - name: Publish to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy site $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
